<h1>Sign in</h1>

<!-- One alert for the whole form: it is inserted with its text, so screen readers announce it once. -->
@if (errorMessage(); as message) {
  <p class="error-summary" role="alert">{{ message }}</p>
}

<form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <cw-text-field
    formControlName="username"
    label="Username"
    autocomplete="username"
    [error]="fieldError('username', 'Enter your username.')"
  />
  <cw-text-field
    formControlName="password"
    label="Password"
    type="password"
    autocomplete="current-password"
    [error]="fieldError('password', 'Enter your password.')"
  />
  <div>
    <button cwButton type="submit" [busy]="pending()">Sign in</button>
  </div>
</form>
